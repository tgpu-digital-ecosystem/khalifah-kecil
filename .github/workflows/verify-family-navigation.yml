name: Verify Khalifah footer
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site footer and family links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path("index.html").read_text("utf-8")
          assert 'class="family-footer"' in html
          assert 'aria-label="Laman dalam keluarga TGPU"' in html
          for url in ("https://tgpu.my/","https://academy.tgpu.my/","https://iqra.tgpu.my/"):
              assert 'href="'+url+'"' in html, url
          assert "family-footer nav" in html
          parser=HTMLParser()
          parser.feed(html)
          print("PASS Khalifah footer and HTML parsing")
          PY

      - name: Verify child-safety and no-cost kindness helper
        run: |
          node --check kindness-missions.js
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const page=fs.readFileSync('index.html','utf8');
          const helper=fs.readFileSync('kindness-missions.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          assert.match(page,/id="khalifah-kindness"/);
          assert.match(page,/kindness-missions.js/);
          assert.match(sw,/kindness-missions.js/);
          for(const word of ['ms:','en:','ar:','Tiada sembang AI terbuka','No open AI chat']) assert.ok(helper.includes(word),word);
          assert.ok(!/\\b(?:fetch|XMLHttpRequest|sendBeacon|localStorage|sessionStorage)\\b/.test(helper));
          assert.ok(!helper.includes('http://')&&!helper.includes('https://'));

          console.log('PASS: child-safe adult-supervised original prompts, offline cache, no network/data');
          JS
