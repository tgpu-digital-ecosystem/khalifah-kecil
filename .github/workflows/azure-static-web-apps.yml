name: Deploy Khalifah Kecil to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: khalifah-kecil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Smoke check deployed site
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 4 "$SITE_URL/" -o /tmp/khalifah.html
          grep -q "KHALIFAH KECIL" /tmp/khalifah.html
          grep -q "Part of the TGPU Digital Ecosystem" /tmp/khalifah.html
          grep -q "https://khalifah.tgpu.my/" /tmp/khalifah.html

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
