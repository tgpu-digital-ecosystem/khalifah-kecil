name: Adab Browser QA
on:
  pull_request:
    paths:
      - 'adab/**'
      - 'tests/adab-browser-qa.cjs'
      - '.github/workflows/khalifah-adab-browser.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run responsive browser QA
        run: node tests/adab-browser-qa.cjs
