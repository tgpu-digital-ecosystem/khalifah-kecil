main{max-width:720px;margin:auto;padding:18px 16px 118px}.brand{display:flex;align-items:center;gap:8px;font-size:1.02rem}.brand:before{content:"✦";display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#174f42;color:#fff}.tag{margin:7px 0 2px 42px;font-weight:700}.brand{font-weight:900;letter-spacing:.04em;color:#174f42}.tag{font-size:.8rem;color:#6d766f}

.pill{display:inline-block;background:#f0dba8;padding:7px 11px;border-radius:99px;font-size:.8rem;font-weight:800}.bigemoji{font-size:5.4rem;text-align:center;filter:drop-shadow(0 8px 10px #17342e18)}.mission-map{display:flex;justify-content:space-between;gap:5px;margin:16px 0}.mission-map span{height:8px;flex:1;border-radius:99px;background:#e4eae5}.mission-map .on{background:#d39d2a}.callout{background:#17342e;color:#fff;border-radius:22px;padding:18px;margin:16px 0}.callout b{color:#f4cf72}.micro{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#8a6a1e}.world{display:grid;gap:16px;margin:22px 0;position:relative}.world:before{content:"";position:absolute;left:31px;top:38px;bottom:38px;border-left:3px dashed #d39d2a66;z-index:0}.mission{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:16px;border-radius:26px;background:#f7f8f3;border:1px solid #e1e6df;box-shadow:0 10px 25px #17342e10;position:relative;z-index:1}.mission:nth-child(1){background:linear-gradient(135deg,var(--sky),#fff)}.mission:nth-child(2){background:linear-gradient(135deg,var(--ocean),#fff)}.mission:nth-child(3){background:linear-gradient(135deg,var(--power),#fff)}.mission:nth-child(4){background:linear-gradient(135deg,var(--nature),#fff)}.mission:nth-child(5){background:linear-gradient(135deg,var(--home),#fff)}.mission .icon{font-size:2.25rem;text-align:center;width:62px;height:62px;display:grid;place-items:center;border-radius:22px;background:#ffffffaa;box-shadow:inset 0 0 0 1px #fff,0 6px 14px #17342e12}.mission h3{margin:0 0 4px}.mission p{margin:0;color:#66746e;font-size:.88rem}.mission.locked{opacity:.58}.status{font-size:.72rem;font-weight:900;padding:7px 10px;border-radius:99px;background:#edf5ef;color:#174f42;white-space:nowrap}.mission:hover{transform:translateY(-2px)}.mission{transition:transform .15s ease,box-shadow .15s ease}.passport{border:2px dashed #d39d2a;background:linear-gradient(135deg,#fffaf0,#f7ecd0);border-radius:22px;padding:18px;margin:16px 0;box-shadow:inset 0 0 0 5px #fff8e8,0 10px 25px #17342e10}.passport strong{font-size:1.08rem}.passport:before{content:"PASPORT PENCIPTA · REKOD PERIBADI";display:block;font-size:.68rem;font-weight:950;letter-spacing:.12em;color:#8a6a1e;margin-bottom:10px}.stamp-row{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.stamp{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #d39d2a;font-size:1.25rem;box-shadow:0 4px 10px #17342e12}.stamp.off{filter:grayscale(1);opacity:.25}.completion-note{background:#edf5ef;border-radius:18px;padding:14px;margin:14px 0}.completion-note b{color:#174f42}

.offline{text-align:center;background:radial-gradient(circle at 50% 15%,#2a6d5d,#17342e 60%);color:white;border:3px solid #d39d2a;box-shadow:0 20px 50px #17342e33}.offline .lead{color:#e5eee9}.offline:before{content:"DUNIA SEBENAR";display:inline-block;background:#f4cf72;color:#17342e;font-weight:950;letter-spacing:.12em;font-size:.72rem;padding:8px 12px;border-radius:99px;margin-bottom:8px}.offline button{margin-top:22px}.callout h2{margin:.35em 0}.real-loop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}.real-loop span{background:#fff7dc;border:1px solid #ead59a;border-radius:14px;padding:9px 4px;text-align:center;font-size:.72rem;font-weight:850}.return-note{background:#edf5ef;border-left:5px solid #174f42;border-radius:14px;padding:12px 14px;margin:14px 0;font-weight:750}
.note{font-size:.88rem;color:#68756f}.summary{background:#f4f8f4;padding:14px;border-radius:16px;margin:10px 0}

.mission-head{display:flex;align-items:center;gap:12px;margin:20px 2px 4px}.mission-orb{width:54px;height:54px;border-radius:19px;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:1.6rem;box-shadow:0 8px 20px #17342e20}.mission-card{border-top:5px solid var(--missionAccent)}.mission-card>.pill{background:color-mix(in srgb,var(--missionAccent) 16%,#fff)}@media(max-width:480px){main{padding-left:12px;padding-right:12px}.card{padding:20px 16px;border-radius:24px}.mission{grid-template-columns:58px 1fr;gap:10px}.mission .icon{width:52px;height:52px}.mission .status{grid-column:2;justify-self:start}.hero-grid{grid-template-columns:1fr}.real-loop{grid-template-columns:1fr 1fr}}@media(min-width:600px){.world .mission:nth-child(even){margin-left:54px}.world .mission:nth-child(odd){margin-right:54px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}} .lab-badge{display:inline-flex;gap:8px;align-items:center;background:#fff3c9;border:1px solid #ecd28b;border-radius:99px;padding:8px 12px;font-weight:850;font-size:.82rem}.card h2{line-height:1.25}</style>

<body><main><header><div class="brand">🌟 KHALIFAH KECIL</div><div class="tag">IMPOSSIBLE → POSSIBLE · DUNIA PEMBELAJARAN</div></header><div id="app"></div></main>
<footer>Fikir dahulu · Cuba di dunia sebenar · Belajar · Baiki · Bantu<br><a href="https://tgpu.my/" target="_blank" rel="noopener noreferrer">Part of the TGPU Digital Ecosystem ↗</a></footer>
<script>
const S={step:+localStorage.kkStep||0,name:localStorage.kkName||"",age:localStorage.kkAge||"8",hero:localStorage.kkHero||"",result:localStorage.kkResult||"",improve:localStorage.kkImprove||"",idea:localStorage.kkIdea||"",retest:localStorage.kkRetest||"",home:localStorage.kkHome||"",oceanResult:localStorage.kkOceanResult||"",oceanImprove:localStorage.kkOceanImprove||"",oceanRetest:localStorage.kkOceanRetest||"",powerResult:localStorage.kkPowerResult||"",powerImprove:localStorage.kkPowerImprove||"",powerRetest:localStorage.kkPowerRetest||"",plantResult:localStorage.kkPlantResult||"",plantImprove:localStorage.kkPlantImprove||"",plantRetest:localStorage.kkPlantRetest||"",homeProblem:localStorage.kkHomeProblem||"",homeIdea:localStorage.kkHomeIdea||"",homeResult:localStorage.kkHomeResult||"",homeImprove:localStorage.kkHomeImprove||"",homeRetest:localStorage.kkHomeRetest||""};
const app=document.querySelector("#app"); const save=()=>{for(const k in S)localStorage["kk"+k[0].toUpperCase()+k.slice(1)]=S[k]};
function go(n){S.step=n;save();render();scrollTo(0,0)} function btn(t,n,c="primary"){return `<button class="${c}" onclick="go(${n})">${t}</button>`}
function missionMeta(){if(S.step>=80)return["❤️","MISI RUMAH","#8f4f45"];if(S.step>=60)return["🌱","MISI ALAM","#4f7a47"];if(S.step>=40)return["⚙","MISI KUASA","#9a6b24"];if(S.step>=20)return["≈","MISI LAUTAN","#39768a"];return["↑","MISI LANGIT","#4e8190"]}function shell(n,title,body){const m=missionMeta();return `<div class="mission-head" style="--accent:${m[2]}"><div class="mission-orb">${m[0]}</div><div><div class="micro">${m[1]}</div><b>Langkah ${n} daripada 10</b></div></div><div class="progress"><i style="width:${n*10}%;background:var(--missionAccent,${m[2]})"></i></div><section class="card mission-card" style="--missionAccent:${m[2]}"><span class="pill">${m[1]} · ${n}/10</span><h1>${title}</h1>${body}</section>`}
function render(){
if(S.step===0&&localStorage.kkCompleted==='1'){S.step=12;save();}
if(S.step===0)app.innerHTML=`<section class="card"><div class="bigemoji">🌍✨</div><div class="micro">Misi untuk dunia sebenar</div><h1>Bayangkan.<br>Tanya. Temui.</h1><p class="lead">Telefon beri kamu <b>misi</b>. Kamu bawa rasa ingin tahu itu ke dunia sebenar.</p><div class="callout">⚡ <b>Kuasa sebenar kamu:</b><br>belajar · mencuba · memperbaiki</div>${btn("Mula pengembaraan →",1)}</section>`;
if(S.step===1)app.innerHTML=shell(1,"Siapa pencipta kecil kita?",`<label>Nama panggilan</label><input id="nm" value="${S.name}" placeholder="Contoh: Aiman"><label>Umur</label><select id="ag"><option>7</option><option ${S.age==="8"?"selected":""}>8</option><option>9</option></select><button class="primary" onclick="S.name=document.querySelector('#nm').value||'Pencipta';S.age=document.querySelector('#ag').value;go(2)">Teruskan →</button><p class="note">Prototaip ini menyimpan kemajuan pada peranti ini sahaja.</p>`);
if(S.step===2)app.innerHTML=shell(2,"Pilih kuasa impianmu",`<p class="lead">Kalau kamu boleh mempunyai satu kuasa, apakah yang kamu pilih?</p><p class="note">Hari ini kita akan tukar kuasa imaginasi menjadi satu penyiasatan sebenar.</p><div class="hero-grid"><button class="choice" onclick="S.hero='Langit';go(3)">🪽<br>LANGIT<br><small>Saya mahu terbang!</small></button><button class="choice" onclick="S.hero='Lautan';go(3)">🌊<br>LAUTAN<br><small>Teroka dasar laut!</small></button><button class="choice" onclick="S.hero='Kuasa';go(3)">💪<br>KUASA<br><small>Jadi sangat kuat!</small></button><button class="choice" onclick="S.hero='Minda';go(3)">🧠<br>MINDA<br><small>Selesaikan misteri!</small></button></div><p class="note">Pilihan ini membantu kamu membayangkan kuasa impian. Misi pertama bermula dengan Langit sebelum dunia lain dibuka.</p>`);
if(S.step===3)app.innerHTML=shell(3,"Kamu mahu terbang!",`<div class="bigemoji">🪽</div><p class="lead">Tetapi ada satu masalah, ${S.name}. Manusia tidak mempunyai sayap seperti burung.</p><h2>Adakah itu bermaksud manusia tidak boleh terbang?</h2>${btn("Saya nak siasat! 🔍",4)}`);
if(S.step===4)app.innerHTML=shell(4,"Fikir dahulu",`<p class="lead">Mengapa manusia tidak boleh terbang seperti burung?</p><button class="choice" onclick="go(5)">🪽 Kita tiada sayap seperti burung</button><button class="choice" onclick="go(5)">⚖️ Badan kita berbeza</button><button class="choice" onclick="document.querySelector('#ideaBox').hidden=false">💡 Saya ada idea lain</button><div id="ideaBox" hidden><textarea id="idea" rows="3" placeholder="Apa idea kamu?"></textarea><button class="primary" onclick="S.idea=document.querySelector('#idea').value;go(5)">Simpan idea saya →</button></div><p class="note">Tiada markah dan tiada jawapan “bodoh”. Kita mahu kamu berfikir sebelum melihat penjelasan.</p>`);
if(S.step===5)app.innerHTML=shell(5,"Misi dunia sebenar",`<p class="lead"><b>Bolehkah kamu membuat sesuatu daripada kertas yang boleh bergerak melalui udara?</b></p><div class="summary">Cari 3 keping kertas terpakai. Buat tiga bentuk: 📄 kertas rata · ⚪ kertas diramas · ✈️ kapal terbang kertas. Cuba semuanya.</div><div class="callout"><div class="micro" style="color:#f4cf72">MOMEN PALING PENTING</div><h2>📵 Telefon turun.</h2>Dunia sebenar ialah makmal kamu sekarang.<div class="real-loop"><span>🔨 BUAT</span><span>🧪 CUBA</span><span>👀 PERHATI</span><span>🔧 BAIKI</span></div></div>${btn("Saya pergi mencuba! →",6)}`);
if(S.step===6)app.innerHTML=`<section class="card offline"><div class="bigemoji">🔬</div><h1>Saya tunggu di sini 👋</h1><p class="lead">Jangan tengok skrin 😄<br><b>Lihat kertas kamu terbang.</b><br>Cuba ketiga-tiga bentuk.</p>${btn("Saya sudah kembali",7,"secondary")}</section>`;
if(S.step===7)app.innerHTML=shell(7,"Apa yang berlaku?",`<p class="lead">Pilih yang paling hampir dengan pengalaman kamu.</p><button class="choice" onclick="S.result='Berjaya';go(8)">😀 Ia berjaya!</button><button class="choice" onclick="S.result='Sedikit';go(8)">🤏 Berjaya sedikit</button><button class="choice" onclick="S.result='Tidak';go(8)">💥 Tak menjadi langsung</button><button class="choice" onclick="S.result='Belum';go(8)">😅 Saya belum cuba</button>`);
if(S.step===8)app.innerHTML=shell(8,"Bagus. Kita ada maklumat.",`<p class="lead">Pencipta tidak takut apabila sesuatu tidak menjadi seperti dijangka. Mereka bertanya: <b>apa yang boleh saya ubah?</b></p><button class="choice" onclick="S.improve='Sayap';go(85)">🪽 Bentuk sayap</button><button class="choice" onclick="S.improve='Berat';go(85)">⚖️ Berat</button><button class="choice" onclick="S.improve='Bentuk';go(85)">📐 Bentuk badan</button><button class="choice" onclick="S.improve='Lontaran';go(85)">💨 Cara melontar</button>`);
if(S.step===85)app.innerHTML=`<section class="card offline"><div class="bigemoji">🔧✈️</div><span class="pill">CUBA LAGI</span><div class="micro" style="color:#f4cf72">PENCIPTA CUBA LAGI</div><h1>Ubah satu perkara</h1><p class="lead">Kamu pilih <b>${S.improve}</b>. Sekarang ubah perkara itu sahaja dan uji sekali lagi. Dengan itu kamu boleh lihat sama ada perubahan kamu membantu.</p><h2>📵 Kembali ke makmal!</h2><p>Uji. Perhati. Bandingkan.</p><button class="secondary" onclick="go(86)">Saya sudah uji semula</button></section>`;
if(S.step===86)app.innerHTML=shell(8.8,"Adakah perubahan membantu?",`<p class="lead">Bandingkan dengan percubaan pertama. Apa yang kamu perhatikan?</p><button class="choice" onclick="S.retest='Lebih baik';go(9)">🚀 Lebih baik</button><button class="choice" onclick="S.retest='Hampir sama';go(9)">🤔 Hampir sama</button><button class="choice" onclick="S.retest='Lebih teruk';go(9)">🔍 Lebih teruk</button><p class="note">Semua keputusan berguna. Eksperimen memberi kita maklumat.</p>`);
if(S.step===9)app.innerHTML=shell(9,"Manusia juga pernah mencuba",`<div class="bigemoji">✈️🚁</div><p class="lead">Manusia tidak memperoleh kuasa ajaib untuk terbang. Melalui pemerhatian, ilmu, percubaan dan penambahbaikan, manusia membangunkan pelbagai teknologi penerbangan.</p><div class="summary">✈️ Kapal terbang · 🚁 Helikopter · 🪂 Payung terjun · 🚀 Roket</div><h2>Imaginasi → soalan → ilmu → ciptaan</h2><p>Imaginasi memberi kita soalan. Pemerhatian dan eksperimen membantu kita menguji idea. Ilmu membantu kita mengetahui apa yang benar-benar boleh dilakukan.</p>${btn("Akhiri misi →",10)}`);
if(S.step===10)app.innerHTML=shell(10,"Ilmu untuk membantu",`<p class="lead">Teknologi penerbangan boleh digunakan untuk menyelamat, membawa bantuan, penyelidikan dan menghubungkan manusia.</p><h2>Kalau kamu seorang pencipta, siapa yang kamu mahu bantu?</h2><textarea id="help" rows="3" placeholder="Ceritakan idea kamu..."></textarea><button class="primary" onclick="localStorage.kkHelp=document.querySelector('#help').value;localStorage.kkCompleted='1';go(11)">Simpan dalam Pasport 🌟</button>`);
if(S.step===11)app.innerHTML=`<section class="card"><div class="bigemoji">🌟</div><h1>Misi selesai, ${S.name}!</h1><p class="lead">Hari ini kamu bertanya, mencuba, memerhati, memilih sesuatu untuk diperbaiki dan memikirkan bagaimana ilmu boleh membantu orang.</p><div class="summary"><b>Pasport Pencipta #001</b><br>🪽 Misi: Bolehkah Manusia Terbang?<br>🧪 Percubaan pertama: ${S.result||"direkod"}<br>🔧 Saya ubah: ${S.improve||"idea saya"}<br>🔁 Selepas ubah: ${S.retest||"diuji semula"}<br>❤️ Saya fikir bagaimana ilmu boleh memberi manfaat.</div><div class="completion-note"><b>Yang penting bukan “menang”.</b><br>Kamu mempunyai bukti bahawa kamu boleh mencuba, memerhati, mengubah idea dan mencuba semula.</div><h2>Kuasa sebenar kamu: belajar, mencuba dan memperbaiki.</h2><p class="lead">Masalah tidak semestinya mempunyai jawapan mudah. Tetapi setiap masalah memberi kita sesuatu untuk disiasat.</p><button class="primary" onclick="go(12)">Buka Dunia Khalifah →</button><button class="secondary" onclick="localStorage.clear();location.reload()">Ulang prototaip</button></section>`;
